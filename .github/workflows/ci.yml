name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Chondrite.Core.slnx

      - name: Build
        run: dotnet build Chondrite.Core.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Chondrite.Core.slnx --configuration Release --no-build

      - name: Pack smoke test
        run: dotnet pack src/Chondrite.Core/Chondrite.Core.csproj --configuration Release --no-build --output artifacts /p:PackageVersion=0.0.0-ci
